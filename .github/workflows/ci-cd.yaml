name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'   # Adjust to your app source directory

env:
  PROJECT_ID: stayrelevantid
  REGION: asia-southeast2
  GAR_REPO: zenith-x-registry
  IMAGE_NAME: app
  GKE_CLUSTER: zenith-x-cluster-testing
  GKE_ZONE: asia-southeast2

jobs:
  build-and-push:
    name: Build & Push to GAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker with GAR auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:latest \
            ./app   # Adjust to your Dockerfile location

      - name: Push Docker image to GAR
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:latest

  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write   # Required to push updated manifests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in kustomization overlay
        run: |
          cd k8s-manifests/overlays/testing
          # Use yq to update the image tag
          yq e ".images[0].newTag = \"${{ github.sha }}\"" -i kustomization.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/overlays/testing/kustomization.yaml
          git commit -m "ci: update image tag to ${{ github.sha }} [skip ci]"
          git push
