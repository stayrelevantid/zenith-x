apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    project: zenith-x
    env: testing
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@stayrelevant.id  # ganti dengan email aktif
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
