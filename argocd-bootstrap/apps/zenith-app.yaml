apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zenith-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/stayrelevantid/zenith-x.git
    targetRevision: main
    path: k8s-manifests/overlays/testing
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
