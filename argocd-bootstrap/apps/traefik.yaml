apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "30.x.x"
    helm:
      values: |
        deployment:
          replicas: 1
          initContainers:
            - name: volume-permissions
              image: busybox:latest
              command: ["sh", "-c", "touch /data/acme.json; chown -v 65532:65532 /data/acme.json; chmod -v 600 /data/acme.json"]
              securityContext:
                runAsNonRoot: false
                runAsGroup: 0
                runAsUser: 0
              volumeMounts:
                - name: data
                  mountPath: /data
        service:
          type: LoadBalancer
        providers:
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: true
        logs:
          general:
            level: INFO
        ports:
          web:
            redirectTo:
              port: websecure
        additionalArguments:
          - "--certificatesresolvers.letsencrypt.acme.email=admin@masmasdeploy.my.id"
          - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
          - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
        persistence:
          enabled: true
          size: 128Mi
          path: /data
        commonLabels:
          project: zenith-x
          env: testing
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
